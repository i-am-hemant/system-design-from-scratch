name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Check formatting
        # gofmt -l prints files that need formatting; any output is a failure.
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test every lesson
        # Each lesson has its own go.mod so lessons stay independently runnable.
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "--- $dir"
            (cd "$dir" && go vet ./... && go test ./...) || failed=1
          done < <(find phases -name go.mod | sort)
          exit "$failed"

      - name: Audit lesson structure
        # Verifies docs match code: sections, quoted identifiers, quiz indices,
        # relative links, and that every command quoted in a doc actually runs.
        run: python3 scripts/audit_lessons.py --run-tests
