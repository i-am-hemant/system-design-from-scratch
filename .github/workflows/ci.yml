name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Run every lesson's tests
        # Lessons are stdlib-only and independently runnable, so no install step.
        # Each code/ directory is discovered and tested on its own.
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r dir; do
            echo "--- $dir"
            (cd "$dir" && python3 -m unittest discover -s . -q) || failed=1
          done < <(find phases -type d -name code | sort)
          exit "$failed"

      - name: Audit lesson structure and verify measurements
        # Verifies docs match code: sections, quoted identifiers, quiz indices,
        # relative links, that quoted commands run, and — the important one —
        # that numbers printed in a doc match what the code prints today.
        run: python3 scripts/audit_lessons.py --run-tests

      - name: Build the site
        # The catalog is generated from phases/ on disk, so a broken build means
        # the site would advertise lessons that do not exist.
        run: node site/build.js

      - name: Test the markdown renderer
        # Lesson content is injected as innerHTML; the escaping tests here are a
        # security check, not a formatting one.
        run: node site/test_md.js

      - name: Test site build artifacts
        run: node site/test_site.js

      - name: Fail if the build left the site dirty
        # data.js, llms.txt and sitemap.xml are committed. If building changes
        # them, someone edited a lesson without rebuilding.
        run: |
          if ! git diff --quiet -- site/; then
            echo "::error::site/ is stale — run 'node site/build.js' and commit the result"
            git diff --stat -- site/
            exit 1
          fi
