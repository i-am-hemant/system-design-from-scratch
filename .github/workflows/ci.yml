name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Check formatting
        # gofmt -l prints files that need formatting; any output is a failure.
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test every lesson
        # Each lesson has its own go.mod so lessons stay independently runnable.
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "--- $dir"
            (cd "$dir" && go vet ./... && go test ./...) || failed=1
          done < <(find phases -name go.mod | sort)
          exit "$failed"

      - name: Audit lesson structure
        # Verifies docs match code: sections, quoted identifiers, quiz indices,
        # relative links, and that every command quoted in a doc actually runs.
        run: python3 scripts/audit_lessons.py --run-tests

      - name: Build the site
        # The catalog is generated from phases/ on disk, so a broken build means
        # the site would advertise lessons that do not exist.
        run: node site/build.js

      - name: Test the markdown renderer
        # Lesson content is injected as innerHTML; the escaping tests here are a
        # security check, not a formatting one.
        run: node site/test_md.js

      - name: Test site build artifacts
        run: node site/test_site.js

      - name: Fail if the build left the site dirty
        # data.js, llms.txt and sitemap.xml are committed. If building changes
        # them, someone edited a lesson without rebuilding.
        run: |
          if ! git diff --quiet -- site/; then
            echo "::error::site/ is stale — run 'node site/build.js' and commit the result"
            git diff --stat -- site/
            exit 1
          fi
